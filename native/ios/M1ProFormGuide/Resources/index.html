<title>M1 Pro Form Guide</title>
<style>
/* ===== M1 Pro Form Guide styles - mobile-first ===== */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg: #0f1216; --bg2: #141922; --card: #1a212c; --card2: #212a38;
  --line: #29323f; --line2: #3a4557;
  --text: #e9edf3; --text2: #aab5c4; --muted: #8391a3;
  --accent: #38c7e3; --accent-soft: rgba(56, 199, 227, 0.14); --accent-ink: #072b33;
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
  --tier-u: #99a1ad; --tier-n: #3d7ff0; --tier-i: #35a463; --tier-a: #f7c14e; --tier-e: #e0359b; --tier-w: #9d6bf7;
  --st-smith: #e2574b; --st-cage: #5b8def; --st-cblh: #18a0b8; --st-cblm: #2fb7a0; --st-cbll: #63c4c9; --st-land: #c98544; --st-body: #9c8cf2; --st-bench: #8b96a8;
  --ok: #35a463; --warn: #f7c14e;
  --tb-h: 58px; --bb-h: 58px;
  --radius: 14px; --radius-s: 9px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
:root[data-theme="light"] {
  --bg: #f2f4f7; --bg2: #eaedf2; --card: #ffffff; --card2: #f5f7fa;
  --line: #d8dde5; --line2: #c2cad6;
  --text: #16202e; --text2: #45536a; --muted: #64748b;
  --accent: #0d8fae; --accent-soft: rgba(13, 143, 174, 0.12); --accent-ink: #ffffff;
  --shadow: 0 8px 22px rgba(23, 32, 46, 0.12);
  --tier-u: #6e7683; --tier-n: #2160db; --tier-i: #0e7f3c; --tier-a: #b97b07; --tier-e: #c31d84; --tier-w: #7a48e0;
  --st-smith: #c9443a; --st-cage: #3b6fe0; --st-cblh: #0d7f94; --st-cblm: #0e8f7a; --st-cbll: #2a9aa0; --st-land: #a86a2e; --st-body: #7a68e8; --st-bench: #5d6a80;
  --ok: #0e7f3c;
}

html { font-size: clamp(15.5px, 14.2px + 0.25vw, 21px); -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.55; min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
body.theme-anim, body.theme-anim * { transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: var(--accent); touch-action: manipulation; }
input, select, textarea { font-size: max(16px, 1rem); }
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 0.5em; letter-spacing: 0.01em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Top bar ===== */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: calc(var(--sat) + 8px) max(12px, var(--sar)) 8px max(12px, var(--sal));
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); flex-shrink: 0; min-height: 44px; }
.brand-ic { width: 30px; height: 30px; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.05; }
.brand-txt b { font-weight: 900; font-size: 1.02rem; letter-spacing: 0.04em; }
.brand-txt i { font-style: normal; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.34em; color: var(--muted); }
.search-wrap { position: relative; flex: 1; min-width: 0; max-width: 560px; display: flex; align-items: center; }
.search-ic { position: absolute; left: 10px; width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
#search {
  width: 100%; min-height: 44px; padding: 8px 74px 8px 34px;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  color: var(--text); -webkit-appearance: none; appearance: none;
}
#search::placeholder { color: var(--muted); }
#search:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.result-count { position: absolute; right: 12px; font-size: 0.72rem; color: var(--muted); pointer-events: none; white-space: nowrap; }
.top-nav { display: none; }
.top-actions { display: flex; gap: 6px; flex-shrink: 0; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 12px;
  background: transparent; border: 1px solid transparent; color: var(--text2);
}
.iconbtn:hover { background: var(--card); color: var(--text); }
.iconbtn svg { width: 21px; height: 21px; }
.iconbtn.on { color: var(--accent); background: var(--accent-soft); }

/* ===== Layout ===== */
.layout { display: block; padding: 0 max(0px, var(--sar)) 0 max(0px, var(--sal)); }
.main { padding: 14px 14px calc(var(--bb-h) + var(--sab) + 22px); min-width: 0; }
.main:focus { outline: none; }

/* ===== Sidebar: bottom sheet on mobile ===== */
.sidebar {
  position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; top: auto;
  max-height: 86dvh; background: var(--bg2);
  border: 1px solid var(--line); border-bottom: none; border-radius: 18px 18px 0 0;
  transform: translateY(103%); transition: transform 0.28s cubic-bezier(0.32, 0.72, 0.25, 1);
  display: flex; flex-direction: column; box-shadow: var(--shadow);
  padding-bottom: var(--sab); visibility: hidden;
}
.sidebar.open { transform: translateY(0); visibility: visible; }
.sheet-grip { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 30px; padding: 8px 0 4px; background: none; border: none; flex-shrink: 0; }
.sheet-grip span { width: 42px; height: 5px; border-radius: 3px; background: var(--line2); display: block; }
@media (min-width: 1000px) { .sheet-grip { display: none; } }
.sidebar-inner { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 8px 16px 20px; }
.side-group { margin-bottom: 16px; }
.side-title { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.side-nav { display: grid; gap: 4px; margin-bottom: 16px; }
.side-nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; min-height: 44px;
  border-radius: 10px; color: var(--text2); text-decoration: none; font-weight: 600;
}
.side-nav a svg { width: 19px; height: 19px; opacity: 0.8; }
.side-nav a.on { background: var(--accent-soft); color: var(--accent); }
.side-nav a:hover { background: var(--card); }
.side-nav .cnt { margin-left: auto; font-size: 0.74rem; color: var(--muted); background: var(--card); border-radius: 999px; padding: 1px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 40px; padding: 6px 13px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line); color: var(--text2);
  font-size: 0.85rem; font-weight: 600; transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--stc, var(--muted)); flex-shrink: 0; }
.chip:hover { border-color: var(--line2); color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.chip.on .dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--stc, var(--accent)) 30%, transparent); }
.linklike { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 0.8rem; padding: 6px; min-height: 34px; }

/* ===== Active filter chips + intro ===== */
.active-chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 12px; align-items: center; }
.achip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
  padding: 4px 6px 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 700;
  background: var(--accent-soft); border: 1px solid var(--accent); color: var(--text);
}
.achip button { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: transparent; border: none; color: var(--text2); }
.achip button:hover { background: var(--card); color: var(--text); }
.achip button svg { width: 13px; height: 13px; }
.intro-note {
  display: flex; gap: 12px; align-items: flex-start;
  background: linear-gradient(135deg, var(--accent-soft), transparent 70%), var(--card);
  border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: var(--radius); padding: 13px 14px; margin-bottom: 14px; font-size: 0.92rem;
}
.intro-note b { color: var(--accent); }
.intro-note .iconbtn { width: 36px; height: 36px; margin: -4px -6px 0 auto; flex-shrink: 0; }
.lib-head { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 12px; flex-wrap: wrap; }
.lib-head h1 { font-size: 1.3rem; font-weight: 900; letter-spacing: 0.02em; margin: 0; }
.lib-head .sub { color: var(--muted); font-size: 0.85rem; }

/* ===== Exercise grid + cards ===== */
.grid { display: grid; grid-template-columns: 1fr; gap: 11px; }
.stgroup-h { grid-column: 1 / -1; display: flex; align-items: center; gap: 9px; margin: 14px 0 2px; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stgroup-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.stgroup-h .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--stc); }
.card {
  position: relative; display: flex; flex-direction: column; gap: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px 14px 12px; padding-left: 17px; text-decoration: none; color: var(--text);
  overflow: hidden; touch-action: manipulation;
}
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stc, var(--line2)); }
.card h3 { font-size: 1.0rem; font-weight: 800; margin: 0; padding-right: 74px; }
.card .mus { color: var(--text2); font-size: 0.8rem; margin-top: -3px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.69rem; font-weight: 700; letter-spacing: 0.02em; padding: 3px 8px; border-radius: 6px; background: var(--card2); color: var(--text2); border: 1px solid var(--line); }
.badge.station { color: #fff; background: var(--stc); border-color: transparent; }
:root[data-theme="light"] .badge.station { color: #fff; }
.badge.std { color: var(--accent); border-color: var(--accent); background: transparent; }
.card-actions { position: absolute; top: 6px; right: 6px; display: flex; }
.card-actions button { width: 40px; height: 40px; border-radius: 10px; background: transparent; border: none; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.card-actions button:hover { color: var(--text); background: var(--card2); }
.card-actions button.on { color: var(--tier-a); }
.card-actions svg { width: 19px; height: 19px; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.empty { text-align: center; color: var(--muted); padding: 48px 20px; }
.empty b { color: var(--text2); }

/* ===== Bottom bar + FAB (mobile) ===== */
.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
  display: flex; justify-content: space-around; align-items: stretch;
  padding: 4px max(6px, var(--sar)) calc(var(--sab) + 4px) max(6px, var(--sal));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.bottombar a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 50px; border-radius: 12px; text-decoration: none; color: var(--muted);
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; position: relative;
}
.bottombar a svg { width: 21px; height: 21px; }
.bottombar a.on { color: var(--accent); }
.bottombar .bcount { position: absolute; top: 3px; right: calc(50% - 21px); background: var(--accent); color: var(--accent-ink); font-size: 0.6rem; font-weight: 800; min-width: 15px; height: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.fab {
  position: fixed; right: calc(14px + var(--sar)); bottom: calc(var(--bb-h) + var(--sab) + 14px); z-index: 36;
  width: 54px; height: 54px; border-radius: 18px; border: 1px solid var(--line2);
  background: var(--card2); color: var(--text); box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}
.fab svg { width: 22px; height: 22px; }
.fab .fcount { position: absolute; top: -5px; right: -5px; background: var(--accent); color: var(--accent-ink); font-size: 0.66rem; font-weight: 800; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }

/* ===== Scrim, toast ===== */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5, 8, 12, 0.55); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.25s; }
.scrim.show { opacity: 1; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--bb-h) + var(--sab) + 18px); transform: translate(-50%, 16px);
  z-index: 90; background: var(--card2); color: var(--text); border: 1px solid var(--line2);
  padding: 10px 18px; border-radius: 999px; font-size: 0.88rem; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.22s, transform 0.22s; box-shadow: var(--shadow);
  max-width: min(92vw, 480px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== Detail view ===== */
.detail { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.detail.enter { animation: d-in 0.22s ease; }
@keyframes d-in { from { opacity: 0.4; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.d-head {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding: calc(var(--sat) + 6px) max(10px, var(--sar)) 6px max(10px, var(--sal));
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.backbtn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 8px 16px 8px 10px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  font-weight: 800; font-size: 0.95rem; flex-shrink: 0;
}
.backbtn svg { width: 20px; height: 20px; }
.d-head .d-title { flex: 1; min-width: 0; font-size: 0.98rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-head .iconbtn { border: 1px solid var(--line); background: var(--card); }
.d-head .iconbtn.on { color: var(--tier-a); }
.navpn { display: none; gap: 4px; }
.d-body { flex: 1; min-height: 0; display: block; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.d-anim { padding: 12px 14px 4px; }
.anim-shell { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: relative; }
.anim-svg { display: block; width: 100%; height: auto; touch-action: pan-y pinch-zoom; }
.anim-static { display: grid; grid-template-columns: 1fr 1fr; }
.anim-static .anim-svg { border-right: 1px solid var(--line); }
.anim-static .anim-svg:last-child { border-right: none; }
.static-lab { position: absolute; top: 8px; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.static-lab.a { left: 12px; } .static-lab.b { left: calc(50% + 12px); }
.anim-controls { display: flex; align-items: center; gap: 8px; padding: 8px 2px 0; }
.anim-controls .ctl {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; min-width: 44px; padding: 8px 14px; border-radius: 12px;
  background: var(--card); border: 1px solid var(--line); color: var(--text); font-weight: 700; font-size: 0.82rem;
}
.anim-controls .ctl svg { width: 18px; height: 18px; }
.anim-controls .ctl.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.anim-caption { margin-left: auto; font-size: 0.74rem; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.d-content { padding: 10px 16px calc(30px + var(--sab)); max-width: 78ch; }
.d-content h1 { font-size: 1.45rem; font-weight: 900; letter-spacing: 0.01em; margin: 6px 0 2px; }
.d-aka { color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }
.d-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.d-sec { margin-top: 22px; }
.d-sec > h2 { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.d-sec > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.d-sec ul, .d-sec ol { margin: 0; padding-left: 1.35em; display: grid; gap: 7px; }
.d-sec li { padding-left: 2px; }
.d-sec ol li::marker { color: var(--accent); font-weight: 800; }
.d-sec ul li::marker { color: var(--muted); }
.cue-list { list-style: none; padding: 0; display: grid; gap: 7px; }
.cue-list li { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 9px 13px; font-weight: 600; }
.mis { display: grid; gap: 9px; }
.mis .mi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; }
.mi .m { font-weight: 700; display: flex; gap: 8px; }
.mi .m::before { content: "✕"; color: var(--st-smith); font-weight: 900; flex-shrink: 0; }
.mi .f { color: var(--text2); margin-top: 4px; display: flex; gap: 8px; font-size: 0.93rem; }
.mi .f::before { content: "→"; color: var(--ok); font-weight: 900; flex-shrink: 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 9px; }
.kv .k { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; }
.kv .k b { display: block; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.kv .k span { font-size: 0.93rem; }
.safe-list { list-style: none; padding: 0; display: grid; gap: 7px; }
.safe-list li { display: flex; gap: 9px; background: color-mix(in srgb, var(--warn) 7%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); border-radius: 10px; padding: 9px 13px; font-size: 0.93rem; }
.safe-list li::before { content: "!"; font-weight: 900; color: var(--warn); background: color-mix(in srgb, var(--warn) 18%, transparent); border-radius: 6px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.swap-row { display: flex; flex-wrap: wrap; gap: 8px; }
.swap-row a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; min-height: 44px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
.swap-row a .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--stc); }
.swap-row a:hover { border-color: var(--accent); }
.ratio-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--text); border-radius: 10px; padding: 7px 12px; font-size: 0.82rem; font-weight: 600; margin: 8px 0 0; }
.ratio-chip b { color: var(--accent); }

/* ===== Strength standards module ===== */
.std-box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 15px 13px; }
.std-note { font-size: 0.8rem; color: var(--muted); margin: 8px 0 0; }
.std-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line2);
  background: var(--card2); color: var(--text); font-weight: 800; font-size: 0.92rem;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn svg { width: 18px; height: 18px; }
.btn.sm { min-height: 40px; padding: 7px 13px; font-size: 0.84rem; }
.std-scale { margin: 14px 0 4px; }
.std-band { display: flex; gap: 2px; height: 26px; border-radius: 8px; overflow: hidden; position: relative; }
.std-seg { min-width: 6px; position: relative; }
.std-seg.hit::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,0.16), rgba(255,255,255,0.16)); }
.std-seg.tier-w-seg { background: linear-gradient(120deg, var(--tier-w), color-mix(in srgb, var(--tier-w) 55%, #ffffff) 50%, var(--tier-w)); }
.std-ticks { position: relative; height: 1.15rem; margin-top: 4px; }
.std-ticks span { position: absolute; transform: translateX(-50%); font-size: 0.72rem; font-weight: 700; color: var(--text2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.std-names { display: flex; gap: 2px; margin-top: 2px; }
.std-names span { display: flex; align-items: center; gap: 5px; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); overflow: hidden; white-space: nowrap; }
.std-names .dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.std-track { position: relative; }
.std-marker { position: absolute; top: -9px; transform: translateX(-50%); transition: left 0.5s cubic-bezier(0.3, 0.9, 0.3, 1); z-index: 2; pointer-events: none; }
.std-marker .pin { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid var(--text); margin: 0 auto; }
.std-marker .stick { width: 2px; height: 28px; background: var(--text); margin: 0 auto; border-radius: 1px; }
.std-inrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.field input, .field select {
  min-height: 46px; padding: 8px 12px; border-radius: 11px; width: 120px;
  background: var(--bg2); border: 1px solid var(--line2); color: var(--text);
  font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field.grow, .field.grow input, .field.grow select { width: auto; flex: 1; min-width: 130px; }
.tier-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 42px; border-radius: 11px; font-weight: 800; font-size: 0.95rem; border: 1px solid transparent; }
.tier-chip .dot { width: 10px; height: 10px; border-radius: 3px; }
.std-verdict { display: flex; flex-direction: column; gap: 6px; }
.std-verdict .next { font-size: 0.82rem; color: var(--text2); }
.std-verdict .next b { color: var(--text); font-variant-numeric: tabular-nums; }
.std-grayed .std-band, .std-grayed .std-names, .std-grayed .std-ticks, .std-grayed .std-marker { filter: grayscale(1) opacity(0.55); }
.smith-warn { display: flex; gap: 10px; background: color-mix(in srgb, var(--warn) 9%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); border-radius: 10px; padding: 11px 13px; font-size: 0.87rem; margin-bottom: 12px; }
.smith-warn svg { width: 20px; height: 20px; color: var(--warn); flex-shrink: 0; margin-top: 2px; }
.calc { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
.calc summary { cursor: pointer; font-weight: 800; font-size: 0.88rem; color: var(--text2); min-height: 44px; display: flex; align-items: center; gap: 8px; list-style: none; }
.calc summary::-webkit-details-marker { display: none; }
.calc summary::before { content: "▸"; color: var(--accent); transition: transform 0.15s; }
.calc[open] summary::before { transform: rotate(90deg); }
.calc-out { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }
.calc-out .k { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 13px; }
.calc-out .k b { display: block; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.calc-out .k span { font-weight: 800; font-variant-numeric: tabular-nums; }
.calc-warn { color: var(--warn); font-size: 0.8rem; font-weight: 600; margin-top: 8px; }

/* ===== Standards page ===== */
.page { max-width: 1080px; }
.page-h { margin: 6px 0 4px; font-size: 1.5rem; font-weight: 900; }
.page-sub { color: var(--text2); margin: 0 0 18px; max-width: 75ch; }
.std-row { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 11px; }
.std-row-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.std-row-h a { color: var(--text); text-decoration: none; font-weight: 800; font-size: 1.02rem; }
.std-row-h a:hover { color: var(--accent); }
.std-row-h .sub { font-size: 0.78rem; color: var(--muted); }
.std-row-h .val { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
.std-row-h .val small { color: var(--muted); font-weight: 600; }
.total-row { border: 1px solid var(--accent); background: linear-gradient(135deg, var(--accent-soft), transparent 60%), var(--card); }
.std-empty { color: var(--muted); font-size: 0.9rem; padding: 8px 2px; }
.caveat-box { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg2); padding: 13px 15px; font-size: 0.85rem; color: var(--text2); margin-top: 18px; display: grid; gap: 8px; }
.caveat-box b { color: var(--text); }

/* ===== Muscles page ===== */
.mus-grid { display: grid; grid-template-columns: 1fr; gap: 11px; }
.mus-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; }
.mus-card h3 { display: flex; align-items: baseline; gap: 8px; font-size: 1.02rem; margin: 0 0 8px; }
.mus-card h3 .cnt { color: var(--muted); font-size: 0.78rem; font-weight: 600; }
.mus-links { display: flex; flex-wrap: wrap; gap: 6px; }
.mus-links a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; min-height: 38px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); color: var(--text2); text-decoration: none; font-size: 0.8rem; font-weight: 600; }
.mus-links a .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--stc); }
.mus-links a:hover { color: var(--text); border-color: var(--line2); }
.mus-links a.sec { opacity: 0.68; }

/* ===== Builder ===== */
.bld-list { display: grid; gap: 9px; margin-bottom: 16px; }
.bld-item { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; }
.bld-item.dragging { opacity: 0.45; border-style: dashed; }
.bld-item .grab { color: var(--muted); cursor: grab; display: none; padding: 8px 2px; }
.bld-item .grab svg { width: 16px; height: 16px; }
.bld-item .nm { flex: 1; min-width: 0; }
.bld-item .nm a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 0.94rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bld-item .nm .st { font-size: 0.72rem; color: var(--muted); }
.bld-item input.sets { width: 74px; min-height: 42px; text-align: center; background: var(--bg2); border: 1px solid var(--line2); border-radius: 9px; font-size: max(16px, 0.85rem); }
.bld-item .mv { display: flex; flex-direction: column; gap: 2px; }
.bld-item .mv button, .bld-item .rm { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--card2); color: var(--text2); display: inline-flex; align-items: center; justify-content: center; }
.bld-item .mv button svg, .bld-item .rm svg { width: 15px; height: 15px; }
.bld-item .mv button:disabled { opacity: 0.3; }
.bld-actions { display: flex; flex-wrap: wrap; gap: 9px; }
.bld-export { width: 100%; min-height: 200px; margin-top: 14px; background: var(--bg2); color: var(--text); border: 1px solid var(--line2); border-radius: 12px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; line-height: 1.6; }

/* ===== Safety page ===== */
.doc { max-width: 75ch; }
.doc h2 { font-size: 1.08rem; font-weight: 900; margin: 26px 0 8px; }
.doc h2:first-child { margin-top: 4px; }
.doc p, .doc li { color: var(--text2); font-size: 0.95rem; }
.doc p b, .doc li b { color: var(--text); }
.doc ul { padding-left: 1.3em; display: grid; gap: 6px; }
.doc .note { border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 10px 10px 0; padding: 11px 14px; margin: 12px 0; }
.doc .warn { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 7%, var(--card)); border-radius: 0 10px 10px 0; padding: 11px 14px; margin: 12px 0; }

/* ===== Settings modal ===== */
.modal-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.modal {
  width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg2); border: 1px solid var(--line2); border-radius: 20px 20px 0 0;
  padding: 18px 18px calc(18px + var(--sab)); box-shadow: var(--shadow);
}
.modal h2 { font-size: 1.15rem; font-weight: 900; display: flex; align-items: center; }
.modal h2 .iconbtn { margin-left: auto; }
.modal .mrow { margin: 16px 0; }
.modal .mlab { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
.seg { display: flex; background: var(--card); border: 1px solid var(--line2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 44px; border: none; background: transparent; border-radius: 9px; color: var(--text2); font-weight: 700; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.mhelp { font-size: 0.78rem; color: var(--muted); margin-top: 6px; line-height: 1.45; }
.bw-row { display: flex; gap: 9px; align-items: center; }
.bw-row input { flex: 1; min-height: 48px; padding: 8px 13px; background: var(--card); border: 1px solid var(--line2); border-radius: 12px; font-variant-numeric: tabular-nums; }
.bw-row .seg { flex-shrink: 0; width: 130px; }

/* =====================================================================
   DESKTOP / TV (16:9 first-class): persistent sidebar + wide grid
   ===================================================================== */
@media (min-width: 760px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 13px; }
  .mus-grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .modal-wrap { align-items: center; padding: 20px; }
  .modal { border-radius: 20px; padding-bottom: 18px; }
  .bld-item .grab { display: block; }
}
@media (min-width: 1000px) {
  :root { --tb-h: 64px; }
  .topbar { gap: 18px; padding-left: max(20px, var(--sal)); padding-right: max(20px, var(--sar)); }
  .top-nav { display: flex; gap: 2px; }
  .top-nav a { display: flex; align-items: center; gap: 7px; padding: 9px 14px; min-height: 44px; border-radius: 11px; color: var(--text2); text-decoration: none; font-weight: 700; font-size: 0.9rem; position: relative; }
  .top-nav a svg { width: 17px; height: 17px; }
  .top-nav a.on { color: var(--accent); background: var(--accent-soft); }
  .top-nav a:hover:not(.on) { background: var(--card); color: var(--text); }
  .top-nav .cnt { background: var(--accent); color: var(--accent-ink); font-size: 0.66rem; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
  .layout { display: grid; grid-template-columns: clamp(280px, 22vw, 318px) minmax(0, 1fr); }
  .sidebar {
    position: sticky; top: calc(var(--tb-h) + var(--sat)); bottom: auto; left: auto; right: auto;
    transform: none; visibility: visible; height: calc(100dvh - var(--tb-h) - var(--sat));
    max-height: none; border: none; border-right: 1px solid var(--line); border-radius: 0;
    background: transparent; box-shadow: none; padding-bottom: 0; z-index: 5;
  }
  .sheet-grip { display: none; }
  .sidebar-inner { padding: 18px 18px 30px; }
  .side-nav-mobileonly { display: none; }
  .chip { min-height: 36px; padding: 5px 12px; font-size: 0.8rem; }
  .main { padding: 22px clamp(18px, 2.2vw, 40px) 60px; }
  .bottombar, .fab { display: none !important; }
  .card { padding: 15px 16px 14px; padding-left: 19px; }
  .card h3 { font-size: 1.04rem; }
  .toast { bottom: 30px; }
  /* Detail: two panes, animation pinned left */
  .d-body { display: grid; grid-template-columns: minmax(420px, 45%) minmax(0, 1fr); overflow: hidden; }
  .d-anim { padding: clamp(18px, 2.4vw, 34px); display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--line); }
  .anim-shell { max-height: calc(100% - 60px); }
  .d-content { overflow-y: auto; overscroll-behavior: contain; padding: clamp(18px, 2.4vw, 34px) clamp(20px, 3vw, 44px) 60px; max-width: none; }
  .d-content-inner { max-width: 75ch; }
  .navpn { display: flex; }
  .d-head { padding-top: calc(var(--sat) + 8px); padding-bottom: 8px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
}
@media (min-width: 1550px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 15px; }
}
@media (min-width: 2200px) {
  .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .layout { grid-template-columns: 340px minmax(0, 1fr); }
}
/* Phone landscape / short viewports: side-by-side detail */
@media (max-width: 999px) and (orientation: landscape) and (max-height: 540px) {
  .d-body { display: grid; grid-template-columns: minmax(300px, 44%) minmax(0, 1fr); overflow: hidden; }
  .d-anim { overflow: hidden; padding: 8px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .anim-shell { max-height: calc(100% - 56px); }
  .d-content { overflow-y: auto; padding: 8px 16px 20px; }
  .d-head { padding-top: max(4px, var(--sat)); padding-bottom: 4px; }
  .backbtn { min-height: 40px; }
  .main { padding-bottom: 90px; }
  .d-sec { margin-top: 14px; }
}
/* Card hover lift - pointer devices only */
@media (hover: hover) and (pointer: fine) {
  .card { transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--line2); }
}

/* ===== Reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .std-marker { transition: none; }
  html { scroll-behavior: auto; }
}

/* ===== Print: clean black-on-white sheet ===== */
@media print {
  :root, :root[data-theme="dark"] {
    --bg: #fff; --bg2: #fff; --card: #fff; --card2: #fff; --line: #999; --line2: #666;
    --text: #000; --text2: #222; --muted: #444; --accent: #000; --accent-soft: #eee; --warn: #000; --ok: #000;
  }
  body { background: #fff !important; color: #000 !important; }
  .topbar, .sidebar, .bottombar, .fab, .scrim, .toast, .modal-wrap, .anim-controls, .card-actions,
  .d-head .iconbtn, .navpn, .backbtn, .std-inrow, .calc, .intro-note .iconbtn, .btn { display: none !important; }
  * { box-shadow: none !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  body.detail-open .layout { display: none !important; }
  .detail { position: static; display: block; }
  .d-body { display: block; overflow: visible; }
  .d-anim { border: none; padding: 0 0 12px; }
  .anim-shell { display: none; }
  .print-frames { display: grid !important; grid-template-columns: 1fr 1fr; gap: 10px; border: 1px solid #999; border-radius: 8px; padding: 8px; }
  .print-frames figure { margin: 0; }
  .print-frames figcaption { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
  .d-content { overflow: visible; max-width: none; padding: 0; }
  .d-sec { break-inside: avoid; margin-top: 14px; }
  .grid { grid-template-columns: 1fr 1fr; gap: 6px; }
  .card { break-inside: avoid; }
  a { color: #000; text-decoration: none; }
}
.print-frames { display: none; }

/* ===== Install bar (hosted PWA build only) ===== */
.install-bar {
  position: fixed; z-index: 55;
  left: max(10px, var(--sal)); right: max(10px, var(--sar));
  bottom: calc(var(--bb-h) + var(--sab) + 10px);
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px; border-radius: 16px;
  background: var(--card2); border: 1px solid var(--line2);
  box-shadow: var(--shadow);
  transform: translateY(140%); opacity: 0;
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0.25, 1), opacity 0.32s;
}
.install-bar.show { transform: translateY(0); opacity: 1; }
.install-bar .ib-ic { flex-shrink: 0; display: flex; }
.install-bar .ib-ic img { border-radius: 9px; display: block; }
.install-bar .ib-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.install-bar .ib-tx b { font-size: 0.92rem; font-weight: 800; }
.install-bar .ib-tx span { font-size: 0.78rem; color: var(--text2); }
.install-bar .ib-tx svg { width: 14px; height: 14px; vertical-align: -2px; color: var(--accent); }
.install-bar .btn { flex-shrink: 0; }
.install-bar .ib-x {
  flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px;
  background: transparent; border: none; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
}
.install-bar .ib-x:hover { background: var(--card); color: var(--text); }
.install-bar .ib-x svg { width: 15px; height: 15px; }
@media (min-width: 1000px) {
  .install-bar { left: auto; right: 22px; bottom: 22px; max-width: 460px; }
}
@media print { .install-bar { display: none !important; } }
</style>

<body>
<div id="app">
  <header class="topbar" id="topbar">
    <a class="brand" id="brandBtn" href="#/lib" aria-label="M1 Pro Form Guide - Library">
      <svg class="brand-ic" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="24" width="7" height="16" rx="2" fill="var(--accent)"/><rect x="49" y="24" width="7" height="16" rx="2" fill="var(--accent)"/><rect x="16" y="19" width="6" height="26" rx="2" fill="currentColor"/><rect x="42" y="19" width="6" height="26" rx="2" fill="currentColor"/><rect x="22" y="29.5" width="20" height="5" rx="2.5" fill="currentColor"/></svg>
      <span class="brand-txt"><b>M1&#8202;PRO</b><i>FORM GUIDE</i></span>
    </a>
    <div class="search-wrap" id="searchWrap">
      <svg class="search-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search exercises, muscles, cues" aria-label="Search exercises" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <span class="result-count" id="resultCount" aria-live="polite"></span>
    </div>
    <nav class="top-nav" id="topnav" aria-label="Sections"></nav>
    <div class="top-actions">
      <button class="iconbtn" id="themeBtn" aria-label="Switch theme"></button>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings"></button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Filters and navigation">
      <button class="sheet-grip" data-closesheet aria-label="Close filters"><span></span></button>
      <div class="sidebar-inner" id="sidebarInner"></div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <button class="fab" id="filterFab" aria-label="Filters" hidden></button>
  <nav class="bottombar" id="bottombar" aria-label="Sections"></nav>

  <div class="scrim" id="scrim" hidden></div>
  <section class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-label="Exercise detail"></section>
  <div class="modal-wrap" id="settingsWrap" hidden role="dialog" aria-modal="true" aria-label="Settings">
    <div class="modal" id="settingsModal"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
/* ============================================================================
   M1 PRO FORM GUIDE - single-file interactive reference
   Built for a RitFit M1 Pro (Smith machine + power cage + dual 2:1 cable
   stacks) in a garage. Everything lives in this one HTML file; it works
   offline from the filesystem or over a local network.

   ---------------------------------------------------------------------------
   HOW THE DATA IS ORGANIZED
   ---------------------------------------------------------------------------
   1) EXERCISES  - array of exercise objects (defined right below, split into
      EX_PART_0..EX_PART_5 purely for readability). Schema per entry:
        id          unique slug; used in URLs (#/ex/<id>) and localStorage
        name, aka   display name + alternate names (searchable)
        station     "Smith" | "Cage/Barbell" | "Cable High" | "Cable Mid" |
                    "Cable Low" | "Landmine" | "Bodyweight" | "Bench"
        attachments accessories needed, e.g. ["Rope"] ([] = none)
        primary[]   / secondary[]  muscle tags (drive filters + muscle page)
        difficulty  "Beginner" | "Intermediate" | "Advanced"
        pattern     "Squat" | "Hinge" | "Horizontal Push" | "Vertical Push" |
                    "Horizontal Pull" | "Vertical Pull" | "Rotation" |
                    "Isolation" | "Core"
        setup[]     machine setup lines (catch/carriage heights, bench angle,
                    body position relative to the frame)
        steps[]     4-7 execution steps     cues[] 3-6 short coaching lines
        mistakes[]  {m: error, fix: correction}
        breathing, tempo, reps {strength, hypertrophy}
        safety[]    lift-specific: where safety arms / spring hooks go + bail
        swaps[]     1-2 ids of same-pattern alternatives
        standards   OPTIONAL key into STANDARDS (only real barbell/compound
                    lifts have one - accessory moves omit it entirely)
        smithCaveat OPTIONAL true on Smith variants: standards render hidden/
                    grayed with the Smith-vs-free-weight warning
        anim        {template, params} - see ANIMATION TEMPLATES below

   ADDING AN EXERCISE: append an object with the schema above to any EX_PART_*
   array (EX_PART_5 is a fine home), give it a unique id, pick an existing
   anim template, and it appears everywhere automatically (search, filters,
   muscle page, builder, deep links).

   2) STANDARDS + BW_BRACKETS (further down) - strength-standard multiplier
      tables. Thresholds are BODYWEIGHT MULTIPLES (1RM lb / bodyweight lb) at
      which you ENTER [Novice, Intermediate, Advanced, Elite, (World Class)];
      rows follow BW_BRACKETS and are linearly interpolated between brackets
      (the last row also serves 260+). Separate male/female tables. For
      type:"bodyweightPlus" lifts (weighted pull-up/dip) multiples are TOTAL
      system weight (bodyweight + added) / bodyweight, and the input asks for
      ADDED weight. ADJUSTING: edit any cell; keep each row ascending
      left-to-right and columns roughly descending as bodyweight rises.
      These are population ESTIMATES blended from published tables - the UI
      labels them as such.

   3) ANIMATION TEMPLATES (TEMPLATES in the animation engine) - ~30 reusable
      motion templates keyed by movement pattern. Each returns keyframed
      poses for an articulated SVG figure (head/torso/upper arm/forearm/
      thigh/shin/foot as separate strokes) plus equipment overlays (Smith
      track, cage + safety arms, cable mast/carriage/line + moving stack,
      bench at angle, landmine pivot). Exercises reference a template plus
      params (load, anchor height, bench angle, grip, ...). ADDING A
      TEMPLATE: add TEMPLATES.myMove = {dur, caption?, build(params)} where
      build returns {frames:[{t, ...pose}], draw(refs, pts, params)}; poses
      are absolute joint angles in degrees (see solveStand/solveHang), and
      draw receives solved joint points each frame for equipment that
      follows the body (bar circles, cable lines). Exercises that resist
      animation use template "staticPair" (start/end panels instead).

   4) APP LOGIC - everything after the data: state, hash router, search/
      filters, favorites, workout builder, standards UI + 1RM calculator,
      the SVG engine, keyboard + swipe input, themes, and print frames.
      localStorage keys are prefixed "m1pfg." and the site never phones home.
   ========================================================================= */

/* ===== SVG ANIMATION ENGINE ================================================
   Articulated 2D figure (side + front rigs) driven by keyframed joint angles.
   Angles are degrees from the vertical; forward = +x (figure faces right).
   Templates return keyframes; equipment (bars, cables, stacks, benches)
   is drawn per-frame from the solved joint points so it tracks the body.  */
"use strict";

const AN = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const VB = { w: 420, h: 300 };
  const G = 272;                 // ground line y
  const RIG = { TORSO: 60, UA: 32, FA: 30, TH: 44, SH: 42, HEADR: 10.5, NECK: 6, FOOT: 17 };
  const D2R = Math.PI / 180;
  const sd = a => Math.sin(a * D2R), cd = a => Math.cos(a * D2R);
  const dd = a => [sd(a), cd(a)];        // 0deg => straight down
  const du = a => [sd(a), -cd(a)];       // 0deg => straight up
  const add = (p, v, len) => ({ x: p.x + v[0] * len, y: p.y + v[1] * len });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  const path = (parent, cls, w, extra) => el("path", Object.assign({ class: cls || "", fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-width": w }, extra || {}), parent);

  /* ---------- pose solvers (side rig) ---------- */
  // pose: {ankX?|hipX, hipY?, th, sh, thF?, shF?, torso, ua, fa, uaF?, faF?, head?, shoLift?, heel?}
  function solveStand(p) {
    const th = p.th ?? 5, sh = p.sh ?? 2;
    let hipY = p.hipY;
    if (hipY == null) hipY = G - 6 - (RIG.TH * cd(th) + RIG.SH * cd(sh));
    let hipX = p.hipX;
    if (hipX == null && p.ankX != null) hipX = p.ankX - RIG.TH * sd(th) - RIG.SH * sd(sh);
    if (hipX == null) hipX = 200;
    if (p.lift) hipY -= p.lift;
    const hip = { x: hipX, y: hipY };
    const knee = add(hip, dd(th), RIG.TH), ank = add(knee, dd(sh), RIG.SH);
    const pts = { hip, knee, ank };
    if (p.thF != null) { pts.kneeF = add(hip, dd(p.thF), RIG.TH); pts.ankF = add(pts.kneeF, dd(p.shF ?? 0), RIG.SH); }
    let sho = add(hip, du(p.torso ?? 0), RIG.TORSO);
    if (p.shoLift) sho = { x: sho.x, y: sho.y - p.shoLift };
    pts.sho = sho;
    pts.elb = add(sho, dd(p.ua ?? 5), RIG.UA);
    pts.hand = add(pts.elb, dd(p.fa ?? 5), RIG.FA);
    if (p.uaF != null) { pts.elbF = add(sho, dd(p.uaF), RIG.UA); pts.handF = add(pts.elbF, dd(p.faF ?? p.uaF), RIG.FA); }
    pts.headC = add(sho, du((p.torso ?? 0) + (p.head ?? 0)), RIG.NECK + RIG.HEADR);
    return pts;
  }
  // hanging: hand is fixed; body solved downward from it
  function solveHang(p) {
    const hand = { x: p.handX, y: p.handY };
    const elb = add(hand, dd(p.fa ?? 180), -RIG.FA);
    const sho = add(elb, dd(p.ua ?? 180), -RIG.UA);
    const hip = add(sho, du(p.torso ?? 0), -RIG.TORSO);
    const knee = add(hip, dd(p.th ?? 6), RIG.TH), ank = add(knee, dd(p.sh ?? -8), RIG.SH);
    const pts = { hand, elb, sho, hip, knee, ank, headC: add(sho, du((p.torso ?? 0) + (p.head ?? 0)), RIG.NECK + RIG.HEADR) };
    if (p.thF != null) { pts.kneeF = add(hip, dd(p.thF), RIG.TH); pts.ankF = add(pts.kneeF, dd(p.shF ?? 0), RIG.SH); }
    return pts;
  }

  /* ---------- figure drawing ---------- */
  function makeFigure(parent) {
    const g = el("g", { class: "fig" }, parent);
    const farLeg = path(g, "", 9, { stroke: "var(--text)", opacity: 0.38 });
    const farArm = path(g, "", 7.5, { stroke: "var(--text)", opacity: 0.38 });
    const torso = path(g, "", 13, { stroke: "var(--text)", opacity: 0.92 });
    const head = el("circle", { r: RIG.HEADR, fill: "var(--text)", opacity: 0.92 }, g);
    const nearLeg = path(g, "", 9.5, { stroke: "var(--text)", opacity: 0.92 });
    const nearArm = path(g, "", 8, { stroke: "var(--text)", opacity: 0.92 });
    return { g, farLeg, farArm, torso, head, nearLeg, nearArm };
  }
  const L = pts => pts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
  function drawFigure(f, pts, opts) {
    const o = opts || {};
    const foot = o.heel
      ? a => { const toe = { x: a.x + RIG.FOOT - 3, y: G }; const heel = add(toe, du(90 + (o.heel || 0)), RIG.FOOT); return [a, heel.y > a.y ? heel : a, toe]; }
      : a => [a, { x: a.x + (o.footDir ?? 1) * RIG.FOOT, y: Math.min(a.y + 5, G) }];
    f.nearLeg.setAttribute("d", L([pts.hip, pts.knee, pts.ank].concat(o.noFoot ? [] : foot(pts.ank).slice(1))));
    f.farLeg.setAttribute("d", pts.kneeF ? L([pts.hip, pts.kneeF, pts.ankF].concat(o.noFoot ? [] : foot(pts.ankF).slice(1))) : "");
    f.torso.setAttribute("d", L([pts.hip, pts.sho]));
    f.head.setAttribute("cx", pts.headC.x); f.head.setAttribute("cy", pts.headC.y);
    f.nearArm.setAttribute("d", L([pts.sho, pts.elb, pts.hand]));
    f.farArm.setAttribute("d", pts.elbF ? L([pts.sho, pts.elbF, pts.handF]) : "");
  }

  /* ---------- front rig ---------- */
  function makeFront(parent) {
    const g = el("g", { class: "figF" }, parent);
    const legs = path(g, "", 9, { stroke: "var(--text)", opacity: 0.85 });
    const torso = el("path", { fill: "var(--text)", opacity: 0.9 }, g);
    const head = el("circle", { r: 10.5, fill: "var(--text)", opacity: 0.92 }, g);
    const armL = path(g, "", 8, { stroke: "var(--text)", opacity: 0.9 });
    const armR = path(g, "", 8, { stroke: "var(--text)", opacity: 0.9 });
    return { g, legs, torso, head, armL, armR };
  }
  // front pose: {cx, shoY, abdL, abdR, bendL, bendR, legOutL?, legOutR?, hands?: [{x,y}] override}
  function solveFront(p) {
    const cx = p.cx ?? 210, shoY = p.shoY ?? 118, hipY = 182;
    const shoL = { x: cx - 29, y: shoY }, shoR = { x: cx + 29, y: shoY };
    const dir = (side, a) => [side * sd(a), cd(a)];
    function arm(sho, side, abd, bend) {
      const elb = add(sho, dir(side, abd), RIG.UA);
      const hand = add(elb, dir(side, abd - (bend ?? 16)), RIG.FA);
      return { elb, hand };
    }
    const aL = arm(shoL, -1, p.abdL ?? 8, p.bendL);
    const aR = arm(shoR, 1, p.abdR ?? 8, p.bendR);
    return { cx, shoY, hipY, shoL, shoR, elbL: aL.elb, handL: p.handL || aL.hand, elbR: aR.elb, handR: p.handR || aR.hand,
      hipL: { x: cx - 12, y: hipY }, hipR: { x: cx + 12, y: hipY },
      legOutL: p.legOutL ?? 7, legOutR: p.legOutR ?? 7, kneeBendR: p.kneeBendR };
  }
  function drawFront(f, pts) {
    const t = `M ${pts.cx - 29} ${pts.shoY - 7} Q ${pts.cx} ${pts.shoY - 13} ${pts.cx + 29} ${pts.shoY - 7} L ${pts.cx + 15} ${pts.hipY + 4} Q ${pts.cx} ${pts.hipY + 9} ${pts.cx - 15} ${pts.hipY + 4} Z`;
    f.torso.setAttribute("d", t);
    f.head.setAttribute("cx", pts.cx); f.head.setAttribute("cy", pts.shoY - 26);
    const leg = (hip, out, kb) => {
      const knee = { x: hip.x + out * 0.55, y: 226 };
      const ank = { x: hip.x + out, y: G - 4 };
      if (kb) { knee.x = hip.x + out; knee.y = 220; ank.x = hip.x + out * 1.6; ank.y = 244; }
      return [hip, knee, ank];
    };
    f.legs.setAttribute("d", L(leg(pts.hipL, -pts.legOutL)) + " " + L(leg(pts.hipR, pts.legOutR, pts.kneeBendR)));
    f.armL.setAttribute("d", L([pts.shoL, pts.elbL, pts.handL]));
    f.armR.setAttribute("d", L([pts.shoR, pts.elbR, pts.handR]));
  }

  /* ---------- equipment drawing helpers ---------- */
  const ANCHOR_Y = { high: 54, mid: 148, low: 248 };
  function drawGround(g) { el("line", { x1: 6, y1: G + 7, x2: VB.w - 6, y2: G + 7, stroke: "var(--line2)", "stroke-width": 2.5, "stroke-linecap": "round" }, g); }
  function drawSmith(g, railX) {
    el("line", { x1: railX, y1: 26, x2: railX, y2: G + 4, stroke: "var(--muted)", "stroke-width": 5, opacity: 0.5 }, g);
    for (let y = 70; y <= 250; y += 18) el("line", { x1: railX - 8, y1: y, x2: railX - 2, y2: y + 5, stroke: "var(--muted)", "stroke-width": 2.5, opacity: 0.55 }, g);
    el("line", { x1: railX - 26, y1: G + 4, x2: railX + 26, y2: G + 4, stroke: "var(--muted)", "stroke-width": 5, opacity: 0.5, "stroke-linecap": "round" }, g);
    el("text", { x: railX, y: 18, "text-anchor": "middle", "font-size": 9, fill: "var(--muted)", "font-weight": 700, "letter-spacing": 1 }, g).textContent = "SMITH TRACK";
  }
  function drawCage(g, opts) {
    const o = opts || {}; const xs = [104, 322];
    xs.forEach(x => {
      el("line", { x1: x, y1: 22, x2: x, y2: G + 4, stroke: "var(--muted)", "stroke-width": 6, opacity: 0.45 }, g);
      for (let y = 46; y <= 252; y += 14) el("circle", { cx: x, cy: y, r: 1.6, fill: "var(--bg)", opacity: 0.9 }, g);
    });
    el("line", { x1: xs[0], y1: 24, x2: xs[1], y2: 24, stroke: "var(--muted)", "stroke-width": 5, opacity: 0.45 }, g);
    if (o.safeY) xs.forEach((x, i) => el("line", { x1: x, y1: o.safeY, x2: x + (i ? -58 : 58), y2: o.safeY, stroke: "var(--st-cage)", "stroke-width": 5, opacity: 0.85, "stroke-linecap": "round" }, g));
    if (o.jY) xs.forEach((x, i) => el("path", { d: `M ${x + (i ? -4 : 4)} ${o.jY} l ${i ? -14 : 14} 0 l 0 7`, stroke: "var(--muted)", "stroke-width": 4, fill: "none", opacity: 0.7 }, g));
  }
  function drawBench(g, bx, angle, len) {
    const topY = G - 48, seatL = (len || 88) / 2;
    const grp = el("g", {}, g);
    el("rect", { x: bx - seatL, y: topY, width: angle ? seatL + 6 : seatL * 2, height: 9, rx: 3, fill: "var(--card2)", stroke: "var(--line2)", "stroke-width": 1.5 }, grp);
    if (angle) {
      const back = el("rect", { x: 0, y: -4.5, width: seatL + 10, height: 9, rx: 3, fill: "var(--card2)", stroke: "var(--line2)", "stroke-width": 1.5 }, grp);
      back.setAttribute("transform", `translate(${bx + 2} ${topY + 4.5}) rotate(${-angle})`);
    }
    [bx - seatL + 12, bx + seatL - 12].forEach(x => el("line", { x1: x, y1: topY + 9, x2: x, y2: G + 2, stroke: "var(--line2)", "stroke-width": 4 }, grp));
    return grp;
  }
  function drawMast(g, side, anchorY, opts) {
    const o = opts || {}; const x = side === "left" ? 16 : VB.w - 16;
    el("line", { x1: x, y1: 20, x2: x, y2: G + 4, stroke: "var(--muted)", "stroke-width": 7, opacity: 0.5 }, g);
    el("line", { x1: x - 10, y1: G + 4, x2: x + 10, y2: G + 4, stroke: "var(--muted)", "stroke-width": 4, opacity: 0.5 }, g);
    const px = side === "left" ? x + 9 : x - 9;
    el("rect", { x: x - 5, y: anchorY - 11, width: 10, height: 22, rx: 2.5, fill: "var(--muted)", opacity: 0.8 }, g);
    const pulley = { x: px, y: anchorY };
    el("circle", { cx: px, cy: anchorY, r: 4.5, fill: "var(--bg)", stroke: "var(--muted)", "stroke-width": 2 }, g);
    let stack = null;
    if (!o.noStack) {
      el("rect", { x: x - 8 + (side === "left" ? 10 : -2), y: G - 62, width: 0.1, height: 0.1, fill: "none" }, g);
      stack = el("rect", { x: side === "left" ? x + 6 : x - 22, y: G - 44, width: 16, height: 44, rx: 2, fill: "var(--muted)", opacity: 0.55 }, g);
      for (let i = 1; i < 5; i++) el("line", { x1: side === "left" ? x + 6 : x - 22, y1: G - 44 + i * 8.8, x2: side === "left" ? x + 22 : x - 6, y2: G - 44 + i * 8.8, stroke: "var(--bg)", "stroke-width": 1.2, opacity: 0.8 }, g);
    }
    return { pulley, stack, x };
  }
  function drawPullupBar(g) {
    el("line", { x1: 128, y1: 46, x2: 300, y2: 46, stroke: "var(--muted)", "stroke-width": 6, opacity: 0.7, "stroke-linecap": "round" }, g);
    [138, 290].forEach(x => el("line", { x1: x, y1: 46, x2: x, y2: 22, stroke: "var(--muted)", "stroke-width": 5, opacity: 0.45 }, g));
    el("text", { x: 214, y: 32, "text-anchor": "middle", "font-size": 9, fill: "var(--muted)", "font-weight": 700, "letter-spacing": 1 }, g).textContent = "PULL-UP BAR";
  }
  function drawDipBars(g) {
    el("line", { x1: 152, y1: 162, x2: 152, y2: G + 4, stroke: "var(--muted)", "stroke-width": 6, opacity: 0.45 }, g);
    el("line", { x1: 236, y1: 162, x2: 236, y2: G + 4, stroke: "var(--muted)", "stroke-width": 6, opacity: 0.3 }, g);
    el("line", { x1: 150, y1: 162, x2: 240, y2: 162, stroke: "var(--muted)", "stroke-width": 6, opacity: 0.8, "stroke-linecap": "round" }, g);
  }
  function drawLandmine(g) {
    el("path", { d: `M 352 ${G + 4} l 10 -14 l 10 14 Z`, fill: "var(--muted)", opacity: 0.7 }, g);
    el("circle", { cx: 362, cy: G - 12, r: 5, fill: "var(--bg)", stroke: "var(--muted)", "stroke-width": 2.5 }, g);
  }
  function drawFootplate(g, x) {
    el("rect", { x: x - 6, y: G - 26, width: 8, height: 26, rx: 2, fill: "var(--muted)", opacity: 0.75 }, g);
  }

  /* ---------- dynamic prop helpers (created once, updated per frame) ---------- */
  function mkPlate(dyn, r) {
    const g = el("g", {}, dyn);
    el("circle", { r: r || 12, fill: "var(--card2)", stroke: "var(--text2)", "stroke-width": 2.5 }, g);
    el("circle", { r: 2.6, fill: "var(--text2)" }, g);
    return g;
  }
  const placeAt = (n, p) => n.setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
  function mkCable(dyn) { return el("path", { fill: "none", stroke: "var(--accent)", "stroke-width": 2.4, "stroke-linecap": "round" }, dyn); }
  const cableD = (a, b) => `M ${a.x.toFixed(1)} ${a.y.toFixed(1)} L ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
  function mkBand(dyn) { return el("path", { fill: "none", stroke: "var(--st-body)", "stroke-width": 3.5, opacity: 0.8, "stroke-linecap": "round" }, dyn); }
  function mkBarLine(dyn, len) {
    const g = el("g", {}, dyn);
    el("line", { x1: -(len || 22), y1: 0, x2: len || 22, y2: 0, stroke: "var(--text2)", "stroke-width": 4, "stroke-linecap": "round" }, g);
    return g;
  }
  // stack rises half the cable travel (2:1 ratio, like the real machine)
  function stackTracker(mast, from) {
    let base = null;
    return hand => {
      if (!mast.stack) return;
      const d = dist(mast.pulley, hand);
      if (base == null) base = d;
      const dy = Math.max(0, (d - base) * 0.5);
      mast.stack.setAttribute("transform", `translate(0 ${(-dy).toFixed(1)})`);
    };
  }

  return { NS, VB, G, RIG, dd, du, sd, cd, add, dist, lerp, ease, el, path, L,
    solveStand, solveHang, makeFigure, drawFigure, makeFront, solveFront, drawFront,
    ANCHOR_Y, drawGround, drawSmith, drawCage, drawBench, drawMast, drawPullupBar,
    drawDipBars, drawLandmine, drawFootplate, mkPlate, placeAt, mkCable, cableD,
    mkBand, mkBarLine, stackTracker };
})();

/* ===== MOTION TEMPLATES =====================================================
   Each: { dur, caption?, build(params, station) -> {frames, rig, scene, props} }
   frames: array of {t:0..1, ...numeric pose fields} (all frames share fields).
   scene(g, ctx): draw static equipment. props(dyn, ctx): create moving props,
   return update(pts, pose, phase) called every frame.                       */
const TEMPLATES = (() => {
  const A = AN, G = A.G, T = {};
  const F = (t, o) => Object.assign({ t }, o);
  const loop = fr => { const f0 = Object.assign({}, fr[0], { t: 1 }); return fr.concat([f0]); };

  // arm angles that keep hands racked on the shoulders as the torso moves
  const gripBack = tor => ({ ua: -34 + tor * 0.9, fa: -168 + tor * 0.9 });
  const gripFront = tor => ({ ua: 55 + tor * 0.7, fa: -174 + tor * 0.7 });

  function landmineProp(dyn, r) {
    const bar = A.el("line", { stroke: "var(--text2)", "stroke-width": 4.5, "stroke-linecap": "round" }, dyn);
    const plate = A.mkPlate(dyn, r || 11);
    return pts => {
      const piv = { x: 362, y: G - 12 }, h = pts.hand;
      const u = { x: h.x - piv.x, y: h.y - piv.y }, m = Math.hypot(u.x, u.y) || 1;
      const pp = { x: h.x + u.x / m * 9, y: h.y + u.y / m * 9 };
      bar.setAttribute("x1", piv.x); bar.setAttribute("y1", piv.y);
      bar.setAttribute("x2", pp.x); bar.setAttribute("y2", pp.y);
      A.placeAt(plate, pp);
    };
  }
  function cableProp(dyn, ctx, opts) {
    const o = opts || {};
    const line = A.mkCable(dyn), track = A.stackTracker(ctx.mast);
    const bar = o.att === "bar" ? A.mkBarLine(dyn, o.barLen || 13) : null;
    const prongs = o.att === "rope" ? A.path(dyn, "", 2.4, { stroke: "var(--accent)" }) : null;
    const knob = (!o.att || o.att === "handle") ? A.el("circle", { r: 2.8, fill: "var(--accent)" }, dyn) : null;
    return (target) => {
      line.setAttribute("d", A.cableD(ctx.mast.pulley, target));
      if (bar) A.placeAt(bar, target);
      if (prongs) prongs.setAttribute("d", `M ${target.x} ${target.y} l ${o.px1 ?? 8} ${o.py1 ?? -6} M ${target.x} ${target.y} l ${o.px2 ?? 8} ${o.py2 ?? 5}`);
      if (knob) { knob.setAttribute("cx", target.x); knob.setAttribute("cy", target.y); }
      track(target);
    };
  }

  /* ---------- SQUAT ---------- */
  T.squat = {
    dur: 3200,
    caption: p => p.style === "lowbar" ? "low-bar" : p.style === "front" ? "front rack" : p.toPress ? "squat + press" : null,
    build(p) {
      const smith = p.load === "smith", lm = p.load === "landmine";
      const ankX = smith ? 215 : 206;
      const leanTop = p.style === "lowbar" ? 12 : p.style === "front" ? 4 : 7;
      const leanBot = p.style === "lowbar" ? 32 : p.style === "front" ? 12 : 19;
      const grip = t => p.style === "front" ? gripFront(t) : lm ? { ua: 30, fa: -138 } : gripBack(t);
      const top = Object.assign({ ankX, th: 8, sh: 4, torso: leanTop, head: 4 }, grip(leanTop));
      const bot = Object.assign({ ankX, th: 94, sh: -24, torso: leanBot, head: 8 }, grip(leanBot));
      let frames;
      if (p.toPress) {
        const press = Object.assign({}, top, { ua: 122, fa: 152 });
        frames = [F(0, top), F(0.3, bot), F(0.58, top), F(0.78, press), F(1, top)];
      } else frames = loop([F(0, top), F(0.5, bot)]);
      return {
        frames, rig: "side",
        scene(g) {
          A.drawGround(g);
          if (smith) A.drawSmith(g, 210);
          else if (lm) A.drawLandmine(g);
          else A.drawCage(g, { safeY: 205, jY: 118 });
        },
        props(dyn) {
          if (lm) return landmineProp(dyn);
          const plate = A.mkPlate(dyn, 12.5);
          return pts => A.placeAt(plate, { x: smith ? 210 : pts.sho.x + (p.style === "front" ? 13 : 5), y: pts.sho.y - 2 });
        }
      };
    }
  };

  /* ---------- SPLIT SQUAT / LUNGE ---------- */
  T.splitSquat = {
    dur: 3000,
    caption: p => p.rearOn === "bench" ? "rear foot on bench" : p.lunge ? "step back each rep" : null,
    build(p) {
      const smith = p.load === "smith";
      const ankX = 236, bench = p.rearOn === "bench";
      const rearTop = bench ? { thF: -34, shF: -100 } : { thF: -26, shF: -12 };
      const rearBot = bench ? { thF: -20, shF: -104 } : { thF: -10, shF: -46 };
      const g = t => smith ? gripBack(t) : { ua: 6, fa: 6 };
      const top = Object.assign({ ankX, th: 16, sh: 6, torso: 6, head: 3 }, rearTop, g(6));
      const bot = Object.assign({ ankX, th: 76, sh: -14, torso: 12, head: 6 }, rearBot, g(12));
      return {
        frames: loop([F(0, top), F(0.5, bot)]), rig: "side",
        scene(gr) {
          A.drawGround(gr);
          if (smith) A.drawSmith(gr, 210); else A.drawCage(gr, { safeY: 215 });
          if (bench) A.drawBench(gr, 128, 0, 76);
        },
        props(dyn) {
          const plate = A.mkPlate(dyn, 12.5);
          return pts => A.placeAt(plate, { x: smith ? 210 : pts.sho.x + 5, y: pts.sho.y - 2 });
        }
      };
    }
  };

  /* ---------- HINGE (RDL / deadlift / GM / pull-through / cable DL / rack pull) ---------- */
  T.hinge = {
    dur: 3200,
    caption: p => p.style === "sumo" ? "wide sumo stance" : p.fromPins ? "reset on the catches" : p.cableBehind ? "face away from the stack" : null,
    build(p) {
      const smith = p.load === "smith", cable = p.load === "cable", lm = p.load === "landmine";
      const ankX = smith ? 212 : lm ? 250 : 205;
      const deep = { knee: { torso: 55, th: 16, sh: -4 }, "mid-shin": { torso: 74, th: 22, sh: -7 }, floor: { torso: 70, th: 58, sh: -18 } }[p.rom || "mid-shin"];
      const armT = t => p.barOnBack ? gripBack(t) : { ua: p.cableBehind ? -6 : 5, fa: p.cableBehind ? -10 : 5 };
      const armB = t => p.barOnBack ? gripBack(t) : { ua: p.cableBehind ? -26 : 4, fa: p.cableBehind ? -30 : 4 };
      const top = Object.assign({ ankX, th: 7, sh: 3, torso: 3, head: 3 }, armT(3));
      const bot = Object.assign({ ankX, th: deep.th, sh: deep.sh, torso: deep.torso, head: 10 }, armB(deep.torso));
      if (p.style === "sumo") { top.thF = 16; top.shF = 8; bot.thF = deep.th + 12; bot.shF = deep.sh + 10; }
      const frames = p.fromPins ? loop([F(0, bot), F(0.5, top)]) : loop([F(0, top), F(0.5, bot)]);
      return {
        frames, rig: "side",
        scene(g, ctx) {
          A.drawGround(g);
          if (smith) A.drawSmith(g, 210);
          else if (lm) A.drawLandmine(g);
          else if (cable) ctx.mast = A.drawMast(g, p.cableBehind ? "left" : "right", A.ANCHOR_Y[p.anchor || "low"]);
          else A.drawCage(g, p.fromPins ? { safeY: 198 } : {});
        },
        props(dyn, ctx) {
          if (lm) return landmineProp(dyn);
          if (cable) {
            const up = cableProp(dyn, ctx, { att: p.cableBehind ? "rope" : "handle", px1: 7, py1: 6, px2: 7, py2: -2 });
            return pts => up(pts.hand);
          }
          const plate = A.mkPlate(dyn, 12.5);
          return pts => {
            const at = p.barOnBack ? { x: pts.sho.x + 5, y: pts.sho.y - 2 } : { x: pts.hand.x + 3, y: pts.hand.y };
            A.placeAt(plate, at);
          };
        }
      };
    }
  };

  /* ---------- HIP THRUST / GLUTE BRIDGE ---------- */
  T.hipThrust = {
    dur: 2800,
    caption: p => p.back === "floor" ? "shoulders on the floor" : "upper back on the bench",
    build(p) {
      const smith = p.load === "smith", floor = p.back === "floor";
      const shoX = 152, shoY = floor ? G - 12 : G - 49;
      const mk = (tor, th, sh, ua, fa) => ({ shoX, shoY, torso: tor, th, sh, ua, fa, head: floor ? -18 : -26 });
      const bot = mk(-121, 64, -46, 96, 44);
      const top = mk(floor ? -99 : -93, 30, -62, 102, 62);
      return {
        frames: loop([F(0, bot), F(0.42, top), F(0.6, top)]), rig: "sideFixedSho",
        scene(g) {
          A.drawGround(g);
          if (smith) A.drawSmith(g, 210);
          if (!floor) A.drawBench(g, 128, 0, 72);
        },
        props(dyn) {
          const plate = A.mkPlate(dyn, 12.5);
          return pts => A.placeAt(plate, { x: smith ? 210 : pts.hip.x + 4, y: pts.hip.y - 8 });
        }
      };
    }
  };

  /* ---------- BENCH PRESS family ---------- */
  T.benchPress = {
    dur: 3000,
    caption: p => p.grip === "close" ? "close grip" : p.fromPins ? "dead stop on the safeties" : p.angle > 0 ? "incline" : p.angle < 0 ? "decline" : null,
    build(p) {
      const smith = p.load === "smith";
      const ang = p.angle || 0;
      const hipX = smith ? 268 : 252, benchTop = G - 48;
      const torso = -90 + ang * 0.85;
      const base = { hipX, hipY: benchTop - 4 - (ang < 0 ? 4 : 0), torso, head: ang * 0.1, th: ang < 0 ? 88 : 72, sh: ang < 0 ? 46 : 12 };
      const bot = Object.assign({}, base, { ua: 82 - ang * 0.4, fa: 176 });
      const top = Object.assign({}, base, { ua: 168 - ang * 0.5, fa: 178 });
      const frames = p.fromPins ? [F(0, bot), F(0.14, bot), F(0.55, top), F(0.9, bot), F(1, bot)] : loop([F(0, top), F(0.5, bot)]);
      return {
        frames, rig: "side",
        scene(g) {
          A.drawGround(g);
          if (smith) A.drawSmith(g, 210);
          else A.drawCage(g, { safeY: p.fromPins ? 196 : 208, jY: 150 });
          A.drawBench(g, hipX - 34, ang, 104);
        },
        props(dyn) {
          const plate = A.mkPlate(dyn, 12.5);
          return pts => A.placeAt(plate, { x: smith ? 210 : pts.hand.x, y: pts.hand.y });
        }
      };
    }
  };

  /* ---------- OVERHEAD PRESS / PUSH PRESS ---------- */
  T.ohp = {
    dur: 3000,
    caption: p => p.legDrive ? "dip + drive" : p.seated ? "seated, bench upright" : null,
    build(p) {
      const smith = p.load === "smith";
      const seated = !!p.seated;
      const base = seated
        ? { hipX: smith ? 208 : 205, hipY: G - 52, th: 85, sh: 52 }
        : { ankX: smith ? 209 : 205, th: 5, sh: 2 };
      const bot = Object.assign({}, base, { torso: -3, head: -8, ua: 25, fa: -152 });
      const top = Object.assign({}, base, { torso: -5, head: 6, ua: 175, fa: 178 });
      let frames;
      if (p.legDrive) {
        const dip = Object.assign({}, bot, { th: 26, sh: -10 });
        frames = [F(0, bot), F(0.18, dip), F(0.5, top), F(0.85, bot), F(1, bot)];
      } else frames = loop([F(0, bot), F(0.5, top)]);
      return {
        frames, rig: "side",
        scene(g) {
          A.drawGround(g);
          if (smith) A.drawSmith(g, 210); else A.drawCage(g, { jY: 168 });
          if (seated) A.drawBench(g, base.hipX - 26, 82, 70);
        },
        props(dyn) {
          const plate = A.mkPlate(dyn, 12.5);
          return pts => A.placeAt(plate, { x: smith ? 210 : pts.hand.x, y: pts.hand.y });
        }
      };
    }
  };

  /* ---------- STANDING CABLE CHEST PRESS ---------- */
  T.chestPressStand = {
    dur: 2800,
    caption: p => p.rotation ? "let the trunk rotate through" : "staggered stance, face away",
    build(p) {
      const base = { ankX: 216, th: 14, sh: 6, thF: -18, shF: -8, head: 2 };
      const back = Object.assign({}, base, { torso: 6, ua: -18, fa: 143 });
      const out = Object.assign({}, base, { torso: p.rotation ? 11 : 6, ua: 85, fa: 88 });
      if (p.singleArm) { back.uaF = -14; back.faF = -20; out.uaF = -14; out.faF = -20; }
      return {
        frames: loop([F(0, back), F(0.5, out)]), rig: "side",
        scene(g, ctx) { A.drawGround(g); ctx.mast = A.drawMast(g, "left", A.ANCHOR_Y[p.anchor || "mid"]); },
        props(dyn, ctx) { const up = cableProp(dyn, ctx, {}); return pts => up(pts.hand); }
      };
    }
  };

  /* ---------- LANDMINE PRESS ---------- */

const REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// shoulder-anchored solver (hip thrust family): shoulders fixed, hips swing
function solveFixedSho(p) {
  const A = AN;
  const sho = { x: p.shoX, y: p.shoY };
  const hip = A.add(sho, A.du(p.torso ?? -100), -A.RIG.TORSO);
  const knee = A.add(hip, A.dd(p.th ?? 50), A.RIG.TH);
  const ank = A.add(knee, A.dd(p.sh ?? -50), A.RIG.SH);
  const elb = A.add(sho, A.dd(p.ua ?? 90), A.RIG.UA);
  const hand = A.add(elb, A.dd(p.fa ?? 60), A.RIG.FA);
  return { sho, hip, knee, ank, elb, hand, headC: A.add(sho, A.du((p.torso ?? -100) + (p.head ?? 0)), A.RIG.NECK + A.RIG.HEADR) };
}

class ExAnim {
  constructor(host, ex, opts) {
    const A = AN;
    this.opts = opts || {};
    this.ex = ex;
    this.tpl = TEMPLATES[ex.anim.template];
    this.params = ex.anim.params || {};
    this.playing = false; this.slow = false; this.phase = 0; this._raf = 0; this._last = 0;
    this.onstate = null;
    if (!this.tpl) { host.textContent = ""; return; }
    this.built = this.tpl.build(this.params, ex.station);
    this.caption = this.tpl.caption ? this.tpl.caption(this.params) : null;
    this.isStatic = !!this.built.staticPanels;
    if (this.isStatic) {
      host.classList.add("anim-static");
      this.built.staticPanels.forEach((panel, i) => {
        const svg = A.el("svg", { viewBox: "0 0 420 300", class: "anim-svg", role: "img", "aria-label": ex.name + " " + panel.label }, host);
        const ctx = { params: this.params };
        const sceneG = A.el("g", {}, svg);
        this.built.scene(sceneG, ctx);
        const dynG = A.el("g", {}, svg);
        const update = this.built.props ? this.built.props(dynG, ctx) : null;
        let pts, fig;
        if (panel.rig === "front") { fig = A.makeFront(svg); pts = A.solveFront(panel.pose); A.drawFront(fig, pts); }
        else { fig = A.makeFigure(svg); pts = A.solveStand(panel.pose); A.drawFigure(fig, pts, {}); }
        if (update) update(pts, panel.pose, i);
        const lab = document.createElement("span");
        lab.className = "static-lab " + (i ? "b" : "a"); lab.textContent = panel.label;
        host.appendChild(lab);
      });
      return;
    }
    this.svg = A.el("svg", { viewBox: "0 0 420 300", class: "anim-svg", role: "img", "aria-label": ex.name + " demonstration" }, host);
    const ctx = this.ctx = { params: this.params };
    const sceneG = A.el("g", {}, this.svg);
    this.built.scene(sceneG, ctx);
    this.dynG = A.el("g", {}, this.svg);
    this.update = this.built.props ? this.built.props(this.dynG, ctx) : null;
    this.rig = this.built.rig || "side";
    this.fig = this.rig === "front" ? A.makeFront(this.svg) : A.makeFigure(this.svg);
    this.dur = this.built.dur || this.tpl.dur || 3000;
    this.renderAt(0);
    if (this.opts.autoplay && !REDUCED_MOTION) this.play();
  }
  interp(ph) {
    const fr = this.built.frames;
    let i = 0;
    while (i < fr.length - 2 && ph > fr[i + 1].t) i++;
    const a = fr[i], b = fr[i + 1];
    const span = Math.max(b.t - a.t, 1e-6);
    const lt = AN.ease(Math.min(1, Math.max(0, (ph - a.t) / span)));
    const pose = {};
    for (const k in a) { if (k === "t") continue; const av = a[k], bv = (b[k] == null ? av : b[k]); pose[k] = AN.lerp(av, bv, lt); }
    return pose;
  }
  renderAt(ph) {
    if (this.isStatic || !this.built.frames) return;
    const pose = this.interp(ph);
    let pts;
    if (this.rig === "front") {
      pts = AN.solveFront(pose);
      if (pose.hbx != null) {
        const hb = { x: pose.hbx, y: pose.hby };
        pts.handL = pts.handR = hb;
        pts.elbL = { x: (pts.shoL.x + hb.x) / 2, y: (pts.shoL.y + hb.y) / 2 + 8 };
        pts.elbR = { x: (pts.shoR.x + hb.x) / 2, y: (pts.shoR.y + hb.y) / 2 + 8 };
      }
      pts.ankR = { x: pts.hipR.x + pts.legOutR, y: AN.G - 4 };
      AN.drawFront(this.fig, pts);
    } else if (this.rig === "hang") {
      pts = AN.solveHang(pose);
      AN.drawFigure(this.fig, pts, { noFoot: false, footDir: 1 });
    } else if (this.rig === "sideFixedSho") {
      pts = solveFixedSho(pose);
      AN.drawFigure(this.fig, pts, {});
    } else {
      pts = AN.solveStand(pose);
      AN.drawFigure(this.fig, pts, { heel: pose.heel || 0 });
    }
    if (this.update) this.update(pts, pose, ph);
  }
  _tick(ts) {
    if (!this.playing) return;
    if (!this._last) this._last = ts;
    const dt = Math.min(64, ts - this._last); this._last = ts;
    this.phase = (this.phase + (dt * (this.slow ? 0.4 : 1)) / this.dur) % 1;
    this.renderAt(this.phase);
    this._raf = requestAnimationFrame(t => this._tick(t));
  }
  play() { if (this.isStatic || this.playing) return; this.playing = true; this._last = 0; this._raf = requestAnimationFrame(t => this._tick(t)); if (this.onstate) this.onstate(); }
  pause() { this.playing = false; cancelAnimationFrame(this._raf); if (this.onstate) this.onstate(); }
  toggle() { this.playing ? this.pause() : this.play(); }
  setSlow(v) { this.slow = v; if (this.onstate) this.onstate(); }
  destroy() { this.pause(); }
}

  if (bw >= B[B.length - 1]) return rows[B.length - 1].slice();

  while (i < B.length - 2 && bw > B[i + 1]) i++;
  const f = (bw - B[i]) / (B[i + 1] - B[i]);
  return rows[i].map((v, j) => v + (rows[i + 1][j] - v) * f);
}
// -> { key, def, mults[], lbs[] (threshold 1RMs; TOTAL for bodyweightPlus), names[] }
function thresholdsFor(key) {
  const s = state.settings;
  if (!s.sex) return null;
  const def = STANDARDS[key];
  if (!def) return null;
  const mults = interpMults(def[s.sex], s.bw);
  const lbs = mults.map(m => m * s.bw);
  const names = TIER_NAMES.slice(1, 1 + mults.length);
  return { key, def, mults, lbs, names };
}
// oneRm: TOTAL lbs (bodyweight + added for bwPlus). -> classification
function classify(th, oneRm) {
  let idx = 0; // 0 = Untrained
  for (let i = 0; i < th.lbs.length; i++) if (oneRm >= th.lbs[i]) idx = i + 1;
  const tierName = idx === 0 ? TIER_NAMES[0] : th.names[idx - 1];
  const next = idx < th.lbs.length ? { name: th.names[idx], lbs: th.lbs[idx] - oneRm } : null;
  return { idx, tierName, next, mult: oneRm / state.settings.bw };
}
const tierVar = idx => idx === 0 ? "--tier-u" : TIER_VARS[Math.min(idx, TIER_VARS.length - 1)];
// stored orm for an exercise in TOTAL lbs (adds bodyweight for pull-up/dip)
function ormTotal(ex) {
  const raw = state.orms[ex.id];
  if (raw == null) return null;

  return def && def.type === "bodyweightPlus" ? state.settings.bw + raw : raw;
}
function epley(w, r) { return r === 1 ? w : w * (1 + r / 30); }
function brzycki(w, r) { return r === 1 ? w : w * 36 / (37 - Math.min(r, 36)); }

/* ---------- search + filters ---------- */
const searchBlob = new Map(EXERCISES.map(e => [e.id,
  [e.name, (e.aka || []).join(" "), e.station, e.pattern, e.primary.join(" "), e.secondary.join(" "), e.cues.join(" "), (e.attachments || []).join(" ")].join(" ").toLowerCase()
]));
function applyFilters() {
  const f = state.filters, q = state.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  state.filtered = EXERCISES.filter(e => {
    if (f.fav && !state.favs.has(e.id)) return false;
    if (f.station.size && !f.station.has(e.station)) return false;
    if (f.pattern.size && !f.pattern.has(e.pattern)) return false;
    if (f.difficulty.size && !f.difficulty.has(e.difficulty)) return false;
    if (f.muscle.size && !e.primary.some(m => f.muscle.has(m))) return false;
    if (f.attachment.size) {
      const at = e.attachments.length ? e.attachments : ["None"];
      if (!at.some(a => f.attachment.has(a))) return false;
    }
    if (terms.length) { const blob = searchBlob.get(e.id); if (!terms.every(t => blob.includes(t))) return false; }
    return true;

}
